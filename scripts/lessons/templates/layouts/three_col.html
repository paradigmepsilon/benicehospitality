<section class="slide {{SLIDE_CLASSES}}" data-layout="three-col" data-audio="{{AUDIO_FILE}}">
  <img class="corner-mark" src="BNHG_letter_mark.svg" alt="" onerror="this.style.display='none'">
  <div class="header">
    <div class="eyebrow">{{EYEBROW}}</div>
    <h2 class="reveal-words">{{H2}}</h2>
  </div>
  <div class="columns">
    {{COLS_HTML}}
  </div>
  <div class="slide-number">{{SLIDE_NUM}} <span class="total">/ {{TOTAL_SLIDES}}</span></div>
  {{DISCLAIMER_FOOTER}}
</section>
