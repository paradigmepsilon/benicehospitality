<section class="slide {{SLIDE_CLASSES}}" data-layout="spread" data-audio="{{AUDIO_FILE}}">
  <div class="photo" style="background-image: url('images/{{IMG_1_FILENAME}}'), linear-gradient(135deg, #807868 0%, #5d5749 100%);">
    <div class="photo-caption">{{PHOTO_CAPTION}}</div>
  </div>
  <div class="text">
    <img class="corner-mark" src="BNHG_letter_mark.svg" alt="" onerror="this.style.display='none'">
    <div class="eyebrow text-eyebrow">{{EYEBROW}}</div>
    <h2 class="reveal-words">{{H2}}</h2>
    {{BODY_HTML}}
  </div>
  <div class="slide-number">{{SLIDE_NUM}} <span class="total">/ {{TOTAL_SLIDES}}</span></div>
  {{DISCLAIMER_FOOTER}}
</section>
