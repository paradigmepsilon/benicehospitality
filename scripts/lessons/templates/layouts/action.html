<section class="slide {{SLIDE_CLASSES}}" data-layout="action" data-audio="{{AUDIO_FILE}}">
  <div class="left">
    <div class="eyebrow">{{EYEBROW}}</div>
    <h2 class="reveal-words">{{H2}}</h2>
    <ol>
      {{STEPS_HTML}}
    </ol>
    {{FOOTER_HTML}}
  </div>
  <div class="right" style="background-image: url('images/{{IMG_1_FILENAME}}'), linear-gradient(135deg, #5b9a2f 0%, #4a7d25 100%);"></div>
  <img class="corner-mark" src="BNHG_letter_mark.svg" alt="" onerror="this.style.display='none'">
  <div class="slide-number">{{SLIDE_NUM}} <span class="total">/ {{TOTAL_SLIDES}}</span></div>
  {{DISCLAIMER_FOOTER}}
</section>
