<section class="slide {{SLIDE_CLASSES}}" data-layout="quote" data-audio="{{AUDIO_FILE}}">
  <div class="photo" style="background-image: url('images/{{IMG_1_FILENAME}}'), linear-gradient(135deg, #4a7d25 0%, #1a1a1a 100%);"></div>
  <div class="content quote-centered">
    <div class="quote-mark">"</div>
    <blockquote>{{QUOTE_TEXT}}</blockquote>
    <div class="signature">{{SIGNATURE}}</div>
    <div class="attribution">{{ATTRIBUTION}}</div>
  </div>
  <img class="corner-mark invert" src="BNHG_letter_mark.svg" alt="" onerror="this.style.display='none'">
  <div class="slide-number invert">{{SLIDE_NUM}} <span class="total">/ {{TOTAL_SLIDES}}</span></div>
</section>
