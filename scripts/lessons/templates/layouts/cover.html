<section class="slide {{SLIDE_CLASSES}}" data-layout="cover" data-audio="{{AUDIO_FILE}}">
  <div class="photo" style="background-image: url('images/{{IMG_1_FILENAME}}'), linear-gradient(135deg, #5b9a2f 0%, #4a7d25 100%);"></div>
  <img class="full-lockup" src="BNHG_full_lockup.svg" alt="Be Nice Hospitality Group" onerror="this.style.display='none'">
  <div class="content">
    <div class="eyebrow">{{EYEBROW}}</div>
    <h1 class="reveal-words">{{H1}}</h1>
    <p class="subtitle">{{SUBTITLE}}</p>
    <div class="meta">{{META}}</div>
  </div>
</section>
