<section class="slide {{SLIDE_CLASSES}}" data-layout="hero-stat" data-audio="{{AUDIO_FILE}}">
  <div class="left">
    <div class="eyebrow stat-eyebrow">{{EYEBROW}}</div>
    <div class="figure" data-count-to="{{COUNT_TO}}" data-count-suffix="{{COUNT_SUFFIX}}">0{{COUNT_SUFFIX}}</div>
    <p class="supporting">{{SUPPORTING}}</p>
    <div class="secondary">
      <div class="secondary-figure">{{SECONDARY_FIGURE}}</div>
      <div class="secondary-text">{{SECONDARY_TEXT}}</div>
    </div>
    <div class="source">{{SOURCE}}</div>
  </div>
  <div class="right" style="background-image: url('images/{{IMG_1_FILENAME}}'), linear-gradient(135deg, #5b9a2f 0%, #4a7d25 100%);"></div>
  <img class="corner-mark" src="BNHG_letter_mark.svg" alt="" onerror="this.style.display='none'">
  <div class="slide-number">{{SLIDE_NUM}} <span class="total">/ {{TOTAL_SLIDES}}</span></div>
  {{DISCLAIMER_FOOTER}}
</section>
